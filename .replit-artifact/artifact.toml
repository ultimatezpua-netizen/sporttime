kind = "mobile"
previewPath = "/"
title = "SPORTTIME UA — Garmin Store"
version = "1.0.0"
id = "artifacts/sporttime"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19563

[services.development]
run = "pnpm --filter @workspace/sporttime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sporttime", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sporttime", "run", "serve" ]

[services.env]
PORT = "19563"
BASE_PATH = "/"
